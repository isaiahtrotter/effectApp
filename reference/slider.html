  :root {
    --bg: #171716;
    --text-color: #D4D4D5;
    --handle-color: #F5F5F7;

    --gray-near: #525253;   /* gray segment adjacent to handle */
    --gray-far:  #353536;   /* gray segment further from handle */

    --gray-h: 2px;   /* bottom gray bar: 2px at rest, 4px on hover */
    --grad-h: 0px;   /* gradient strip stacked above the gray bar: hidden at rest, 12px on hover */
    --thumb-w: 2px;
    --thumb-h: 10px;

    --anim-ms: 65; /* the hover/track animation duration in milliseconds, typed directly */
  }

  .track-wrap.hovered {
    --gray-h: 4px;
    --grad-h: 12px;
    --thumb-h: 16px;
  }

  /* Light mode overrides. Gradients are intentionally left untouched. */
  html.light-mode {
    --bg: #EFEFF1;
    --text-color: #2E2E2F;
    --handle-color: #121213;
    --gray-near: #CDCECF;
    --gray-far:  #DCDDDF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    height: 100%;
    transition: background-color 200ms ease-out;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Baikal Trial Light', sans-serif;
  }

  .slider-card {
    width: 300px;
    padding: 0;
  }

  .slider-item + .slider-item {
    margin-top: 32px;
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0;
  }

  .label {
    font-family: 'Baikal Trial Light', sans-serif;
    font-size: 14px;
    color: var(--text-color);
    letter-spacing: 0.2px;
    user-select: none;
    transition: color 200ms ease-out;
  }

  .value {
    font-family: 'Baikal Trial Light', sans-serif;
    font-size: 14px;
    color: var(--text-color);
    font-variant-numeric: tabular-nums;
    transition: color 200ms ease-out;
  }

  .value sup {
    font-size: 0.62em;
    font-weight: 400;
    vertical-align: super;
    margin-left: 1px;
    color: var(--text-color);
    opacity: 0.9;
    user-select: none;
    transition: color 200ms ease-out;
  }

  /* the number is a real input so it can be clicked and edited, but it's
     styled to look exactly like plain text until you interact with it */
  .value-num {
    font-family: 'CommitMono', 'ui-monospace', 'Menlo', 'Consolas', monospace;
    font-size: inherit;
    color: inherit;
    font-variant-numeric: inherit;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    text-align: right;
    cursor: text;
    transition: color 200ms ease-out;
  }

  .value-num::selection {
    background: var(--text-color);
    color: var(--bg);
  }

  .label-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text-color);
    cursor: pointer;
    opacity: 0;
    transition: opacity 150ms ease-out, color 200ms ease-out;
  }

  .row:hover .icon-btn {
    opacity: 1;
  }

  .icon-btn .icon-hover {
    display: none;
  }

  /* Which icon shows is controlled by JS (an "icon-active" class), not a
     plain :hover rule — that lets us freeze the icon's state while it's
     fading out on exit, instead of it visibly snapping back to the
     default icon a moment before disappearing. */
  .icon-btn.icon-active .icon-default {
    display: none;
  }

  .icon-btn.icon-active .icon-hover {
    display: block;
  }

  /* ---------- track / thumb ---------- */

  .track-wrap {
    position: relative;
    height: 32px;
    display: flex;
    align-items: flex-end;
    cursor: pointer;
  }

  /* persistent gray base bar — always visible, 2px at rest, 4px on hover */
  .gray-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--gray-h);
    display: flex;
    z-index: 1;
    pointer-events: none;
    transition: height calc(var(--anim-ms) * 1ms) linear;
  }

  .gray-fill {
    height: 100%;
    flex: 0 0 auto;
    transition: background-color 200ms ease-out;
  }

  .gray-fill.before {
    background: var(--gray-near);
  }

  .gray-fill.after {
    background: var(--gray-far);
  }

  /* gradient layer — stacked directly above the gray bar (never overlapping
     it), hidden until hover. Both segments share one continuous gradient
     image (positioned via JS so it never re-stretches); the "ahead of
     handle" side is permanently dimmed to 40% opacity. */
  .gradient-seg {
    position: absolute;
    bottom: var(--gray-h);
    height: var(--grad-h);
    overflow: hidden;
    z-index: 2;
    pointer-events: none;
    transition:
      height calc(var(--anim-ms) * 1ms) linear,
      bottom calc(var(--anim-ms) * 1ms) linear;
    background-image: linear-gradient(
      to right,
      #DD4D37 0%,
      #FFD753 14%,
      #FFFFFF 30%,
      #53A1CE 72%,
      #0863E3 100%
    );
    background-repeat: no-repeat;
  }

  .gradient-seg.before {
    left: 0;
    opacity: 1;
  }

  .gradient-seg.after {
    opacity: 0.4;
  }

  /* second slider variant: dark gray → white instead of the color temp scale */
  .gradient-seg.mono {
    background-image: linear-gradient(
      to right,
      #3A3A3C 0%,
      #FFFFFF 100%
    );
  }

  .thumb {
    position: absolute;
    bottom: 0;
    left: 0%;
    width: var(--thumb-w);
    height: var(--thumb-h);
    background: var(--handle-color);
    border-radius: 0;
    transform: translateX(-50%);
    pointer-events: none;
    transition: width calc(var(--anim-ms) * 1ms) linear, height calc(var(--anim-ms) * 1ms) linear, background-color 200ms ease-out;
    z-index: 3;
  }

  .range-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    z-index: 4;
  }

  .range-input::-webkit-slider-runnable-track {
    width: 100%;
    height: 100%;
    background: transparent;
  }

  .range-input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 1px;
    height: 100%;
    background: transparent;
  }

  .range-input::-moz-range-track {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
  }

  .range-input::-moz-range-thumb {
    width: 1px;
    height: 100%;
    background: transparent;
    border: none;
  }
</style>

  <div class="slider-card">

              <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>

      <div class="track-wrap">
        <div class="gray-bar">
          <div class="gray-fill before"></div>
          <div class="gray-fill after"></div>
        </div>
        <div class="gradient-seg before"></div>
        <div class="gradient-seg after"></div>
        <div class="thumb"></div>

    <div class="slider-item" data-min="0.5" data-max="8" data-value="2.2" data-decimals="1">
      <div class="row">
        <span class="label-group">
          <span class="label">Gamma</span>
          <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
            <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
              <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
              <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
            </svg>
            <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
            </svg>
          </button>
        </span>
        <span class="value"><input class="value-num" type="text" inputmode="decimal" value="2.2" size="3" maxlength="3" /></span>
      </div>

      <div class="track-wrap">
        <div class="gray-bar">
          <div class="gray-fill before"></div>
          <div class="gray-fill after"></div>
        </div>
        <div class="gradient-seg before mono"></div>
        <div class="gradient-seg after mono"></div>
        <div class="thumb"></div>
        <input
          class="range-input"
          type="range"
          min="0.5"
          max="8"
          step="any"
          value="2.2"
        />
      </div>
    </div>

    <div class="slider-item" data-min="20" data-max="20000" data-value="440" data-decimals="0">
      <div class="row">
        <span class="label-group">
          <span class="label">Frequency</span>
          <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
            <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
              <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
              <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
            </svg>
            <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
            </svg>
          </button>
        </span>
        <span class="value"><input class="value-num" type="text" inputmode="numeric" value="440" size="5" maxlength="5" /></span>
      </div>

      <div class="track-wrap">
        <div class="gray-bar">
          <div class="gray-fill before"></div>
          <div class="gray-fill after"></div>
        </div>
        <div class="thumb"></div>
        <input
          class="range-input"
          type="range"
          min="20"
          max="20000"
          step="any"
          value="440"
        />
      </div>
    </div>
  </div>

<script>
  document.querySelectorAll('.slider-item').forEach(setupSlider);

  // Light/dark theme toggle, keyboard-only: pressing "L" flips between
  // dark and light. The 200ms ease-out transition itself lives in CSS on
  // each color-bearing property; this just toggles the class.
  let isLight = false;
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'l' || e.key === 'L') {
      isLight = !isLight;
      document.documentElement.classList.toggle('light-mode', isLight);
    }
  });

  // Hover/track animation duration in milliseconds (--anim-ms). No UI for
  // this anymore — "x" is a hidden shortcut that slows it to 375ms (from
  // the default) and back.
  const DEFAULT_ANIM_MS = 65;

  function applyAnimMs(ms) {
    document.documentElement.style.setProperty('--anim-ms', ms);
  }

  // Pressing "x" slows every animation on the page to 20% speed (5x the
  // duration); pressing it again restores normal speed.
  let slowMotion = false;
  document.addEventListener('keydown', (e) => {
    if (e.key === 'x' || e.key === 'X') {
      slowMotion = !slowMotion;
      applyAnimMs(slowMotion ? 375 : DEFAULT_ANIM_MS);
    }
  });

  function setupSlider(item) {
    const input   = item.querySelector('.range-input');
    const wrap    = item.querySelector('.track-wrap');
    const grayBar = item.querySelector('.gray-bar');
    const before  = item.querySelector('.gray-fill.before');
    const after   = item.querySelector('.gray-fill.after');
    const gradBefore = item.querySelector('.gradient-seg.before');
    const gradAfter  = item.querySelector('.gradient-seg.after');
    const thumb   = item.querySelector('.thumb');
    const valueEl = item.querySelector('.value-num');
    const decimals = parseInt(item.dataset.decimals || '0', 10);

    const STRETCH_EASE = 'ease-out';

    function stretchMs() {
      const v = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue('--anim-ms')
      );
      return isNaN(v) ? 65 : v;
    }

    function stretchAnim() {
      return `${stretchMs()}ms ${STRETCH_EASE}`;
    }

    function updateGradientGeometry(pct) {
      // Not every slider has a gradient (e.g. a plain frequency slider) —
      // skip entirely if these elements don't exist.
      if (!gradBefore || !gradAfter) return;

      // Keep the gradient image continuous across the two segments by
      // sizing/positioning it against the track's real current pixel width
      // (which changes while the track is being elastically stretched),
      // rather than letting each segment re-stretch its own gradient.
      const trackWidthPx = wrap.getBoundingClientRect().width;
      const beforeWidthPx = (trackWidthPx * pct) / 100;

      gradBefore.style.width = pct + '%';
      gradBefore.style.backgroundSize = trackWidthPx + 'px 100%';
      gradBefore.style.backgroundPosition = '0px 0';

      gradAfter.style.left = pct + '%';
      gradAfter.style.width = (100 - pct) + '%';
      gradAfter.style.backgroundSize = trackWidthPx + 'px 100%';
      gradAfter.style.backgroundPosition = (-beforeWidthPx) + 'px 0';
    }

    let currentPct = 0;

    function update() {
      const min = parseFloat(input.min);
      const max = parseFloat(input.max);
      const val = parseFloat(input.value);
      currentPct = ((val - min) / (max - min)) * 100;

      before.style.flexBasis = currentPct + '%';
      after.style.flexBasis  = (100 - currentPct) + '%';
      thumb.style.left = currentPct + '%';
      valueEl.value = val.toFixed(decimals);

      updateGradientGeometry(currentPct);
    }

    // Clicking the number selects it entirely — unless you click-and-drag
    // to highlight a specific substring, in which case that selection is
    // respected. We let the browser's native mousedown/drag selection run
    // untouched, and only step in on mouseup: if nothing ended up
    // highlighted (i.e. it was a plain click, not a drag), select
    // everything right then, in the same tick, so there's no visible
    // "caret first, then selected" flash.
    function selectAllValue() {
      valueEl.select();
    }

    let mouseInteraction = false;

    valueEl.addEventListener('mousedown', () => {
      mouseInteraction = true;
    });
    valueEl.addEventListener('focus', () => {
      // Keyboard-triggered focus (e.g. Tab) has no mousedown/mouseup of
      // its own, so select-all there directly. Mouse-triggered focus is
      // handled by the mouseup logic instead, so it doesn't fight with
      // an in-progress drag-selection.
      if (!mouseInteraction) selectAllValue();
    });
    valueEl.addEventListener('mouseup', () => {
      if (valueEl.selectionStart === valueEl.selectionEnd) {
        selectAllValue();
      }
      mouseInteraction = false;
    });
    valueEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') valueEl.blur();
    });
    valueEl.addEventListener('blur', () => {
      const min = parseFloat(input.min);
      const max = parseFloat(input.max);
      let v = parseFloat(valueEl.value);
      if (isNaN(v)) v = parseFloat(input.value);
      v = Math.min(max, Math.max(min, v));
      input.value = v;
      update();
    });

    let dragging = false;
    let trackRect = null;
    let baseWidthPx = 0;
    let lastPull = 0;
    let lastDir = 0;

    const MAX_PULL = 10; // px the track can be stretched past either end

    function rubberBand(overshootPx) {
      // classic diminishing-return rubber-band curve: fast at first,
      // then fights back harder the further you pull, capped at MAX_PULL.
      const c = 0.55;
      return MAX_PULL * (1 - 1 / ((overshootPx * c) / MAX_PULL + 1));
    }

    function applyStretch(pull, dir, animate) {
      // Only the track (bar + gradient + handle) stretches — the gray bar
      // and gradient resize right along with it (via their %-based CSS),
      // so they stay physically connected to the handle, continuing the
      // same gradient/gray fill into the stretched-out slack. The text
      // row, which lives outside track-wrap, is never touched.
      const wrapTransition = animate ? `width ${stretchAnim()}, transform ${stretchAnim()}` : 'none';
      wrap.style.transition = wrapTransition;
      wrap.style.width = (baseWidthPx + pull) + 'px';
      wrap.style.transform = dir === -1 ? `translateX(${-pull}px)` : 'translateX(0px)';

      updateGradientGeometry(currentPct);
      lastPull = pull;
      lastDir = dir;
    }

    function onDragMove(e) {
      if (!dragging || !trackRect) return;
      let overshoot = 0;
      let dir = 0;
      if (e.clientX < trackRect.left) {
        overshoot = trackRect.left - e.clientX;
        dir = -1;
      } else if (e.clientX > trackRect.right) {
        overshoot = e.clientX - trackRect.right;
        dir = 1;
      }
      const pull = overshoot > 0 ? rubberBand(overshoot) : 0;
      applyStretch(pull, dir, false);
    }

    // Known idle/hover heights for the gray bar + gradient stack (matches
    // the --gray-h / --grad-h values defined in CSS).
    const GRAY_H_IDLE = 2, GRAY_H_HOVER = 4;
    const GRAD_H_IDLE = 0, GRAD_H_HOVER = 12;

    function setBarHeights(grayH, gradH, animate) {
      // Set explicit inline height/bottom values directly — inline styles
      // always win over the var()-driven CSS rule, so this gives us full
      // control over the animation regardless of the 'hovered' class state.
      const heightT = animate ? `height ${stretchAnim()}` : 'none';
      grayBar.style.transition = heightT;
      grayBar.style.height = grayH + 'px';

      if (!gradBefore || !gradAfter) return;

      const gradTransition = animate
        ? `height ${stretchAnim()}, bottom ${stretchAnim()}`
        : 'none';
      gradBefore.style.transition = gradTransition;
      gradBefore.style.height = gradH + 'px';
      gradBefore.style.bottom = grayH + 'px';

      gradAfter.style.transition = gradTransition;
      gradAfter.style.height = gradH + 'px';
      gradAfter.style.bottom = grayH + 'px';
    }

    function clearBarHeightOverrides() {
      grayBar.style.height = '';
      grayBar.style.transition = '';
      if (!gradBefore || !gradAfter) return;
      gradBefore.style.height = '';
      gradBefore.style.bottom = '';
      gradBefore.style.transition = '';
      gradAfter.style.height = '';
      gradAfter.style.bottom = '';
      gradAfter.style.transition = '';
    }

    function setHover(on) {
      wrap.classList.toggle('hovered', on || dragging);
    }

    wrap.addEventListener('mouseenter', () => setHover(true));
    wrap.addEventListener('mouseleave', () => setHover(false));

    input.addEventListener('pointerdown', () => {
      dragging = true;
      trackRect = wrap.getBoundingClientRect();
      baseWidthPx = trackRect.width;
      applyStretch(0, 0, false);
      wrap.classList.add('hovered');
    });
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', () => {
      let wasPulled = false;

      if (dragging) {
        dragging = false;
        wasPulled = lastPull > 0.01;

        if (wasPulled) {
          // Commit the current stretched state with no transition first,
          // then force a reflow so the browser has a "before" frame to
          // animate from — otherwise setting transition + width in the
          // same tick can just jump instead of animating.
          applyStretch(lastPull, lastDir, false);
          void wrap.offsetWidth; // force reflow
          requestAnimationFrame(() => {
            applyStretch(0, 0, true);
          });
        } else {
          applyStretch(0, 0, false);
        }
      }

      if (wasPulled) {
        // Overshoot, by definition, means the cursor was outside the
        // track's natural bounds — but since we resize `wrap` itself to
        // follow the cursor during the stretch, wrap.matches(':hover')
        // is unreliable here (the box grew to include the cursor). So we
        // don't gate on it in this branch; we know hover should be
        // considered "lost" whenever the rubber band fired.
        setBarHeights(GRAY_H_HOVER, GRAD_H_HOVER, false);
        void grayBar.offsetHeight; // force reflow
        requestAnimationFrame(() => {
          setBarHeights(GRAY_H_IDLE, GRAD_H_IDLE, true);
          wrap.classList.remove('hovered');
          setTimeout(clearBarHeightOverrides, stretchMs() + 30);
        });
      } else if (!wrap.matches(':hover')) {
        wrap.classList.remove('hovered');
      }
    });

    input.addEventListener('focus', () => wrap.classList.add('hovered'));
    input.addEventListener('blur', () => {
      if (!dragging && !wrap.matches(':hover')) wrap.classList.remove('hovered');
    });

    // Icon hover swap: flips to the other icon immediately while hovering
    // it directly, reverts instantly when moving to elsewhere still
    // inside the row, but freezes its state when the mouse leaves the row
    // entirely — it just fades out as whatever it was, then quietly
    // resets once invisible, rather than visibly snapping back first.
    const row = item.querySelector('.row');
    const iconBtn = item.querySelector('.icon-btn');
    if (row && iconBtn) {
      iconBtn.addEventListener('mouseenter', () => {
        iconBtn.classList.add('icon-active');
      });
      iconBtn.addEventListener('mouseleave', (e) => {
        const stillInRow = e.relatedTarget && row.contains(e.relatedTarget);
        if (stillInRow) iconBtn.classList.remove('icon-active');
      });
      row.addEventListener('mouseleave', () => {
        setTimeout(() => iconBtn.classList.remove('icon-active'), 160);
      });
    }

    input.addEventListener('input', update);
    update();
  }
</script>
