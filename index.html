<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effect.app components</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Components</span>
        <button class="theme-toggle" type="button" aria-label="Toggle light/dark theme">
          <svg class="theme-icon theme-icon-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 8.5C13.4 11.5 10.7 13.75 7.5 13.75C3.91 13.75 1 10.84 1 7.25C1 4.05 3.25 1.35 6.25 0.75C5.47 1.83 5 3.16 5 4.6C5 8.19 7.91 11.1 11.5 11.1C12.4 11.1 13.24 10.92 14 10.6C14 9.9 13.98 9.2 14 8.5Z" fill="currentColor"/>
          </svg>
          <svg class="theme-icon theme-icon-light" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="3.25" fill="currentColor"/>
            <path d="M8 0.5V2.5M8 13.5V15.5M15.5 8H13.5M2.5 8H0.5M13.16 2.84L11.75 4.25M4.25 11.75L2.84 13.16M13.16 13.16L11.75 11.75M4.25 4.25L2.84 2.84" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <button class="nav-item is-active" data-target="sliders">Sliders</button>
        </div>
      </nav>
    </aside>

    <main class="content">
      <section class="panel" id="sliders" data-panel>
        <div class="slider-card">
          <h1 class="panel-title">Sliders</h1>

          <div class="slider-item" data-min="1700" data-max="8000" data-value="3300">
            <div class="row">
              <span class="label-group">
                <span class="label">Highlight Temperature</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="decimal" value="3300" size="4" maxlength="4" /><sup>K</sup></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="gradient-seg before"></div>
              <div class="gradient-seg after"></div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="1700"
                max="8000"
                step="any"
                value="3300"
              />
            </div>
          </div>

          <div class="slider-item" data-min="0.5" data-max="8" data-value="2.2" data-decimals="1">
            <div class="row">
              <span class="label-group">
                <span class="label">Gamma</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="decimal" value="2.2" size="3" maxlength="3" /></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="gradient-seg before mono"></div>
              <div class="gradient-seg after mono"></div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="0.5"
                max="8"
                step="any"
                value="2.2"
              />
            </div>
          </div>

          <div class="slider-item" data-min="20" data-max="20000" data-value="440" data-decimals="0">
            <div class="row">
              <span class="label-group">
                <span class="label">Frequency</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="numeric" value="440" size="5" maxlength="5" /></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="20"
                max="20000"
                step="any"
                value="440"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="scripts/slider.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
