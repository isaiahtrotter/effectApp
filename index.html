<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effect.app components</title>
<link rel="icon" href="favicon_io/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="panel-title sidebar-title">Components</h1>
        <button class="theme-toggle" type="button" aria-label="Toggle light/dark theme">
          <svg class="theme-icon theme-icon-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 8.5C13.4 11.5 10.7 13.75 7.5 13.75C3.91 13.75 1 10.84 1 7.25C1 4.05 3.25 1.35 6.25 0.75C5.47 1.83 5 3.16 5 4.6C5 8.19 7.91 11.1 11.5 11.1C12.4 11.1 13.24 10.92 14 10.6C14 9.9 13.98 9.2 14 8.5Z" fill="currentColor"/>
          </svg>
          <svg class="theme-icon theme-icon-light" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="3.25" fill="currentColor"/>
            <path d="M8 0.5V2.5M8 13.5V15.5M15.5 8H13.5M2.5 8H0.5M13.16 2.84L11.75 4.25M4.25 11.75L2.84 13.16M13.16 13.16L11.75 11.75M4.25 4.25L2.84 2.84" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group">
          <button class="nav-item is-active" data-target="sliders">Sliders</button>
        </div>
      </nav>
    </aside>

    <main class="content">
      <section class="panel" id="sliders" data-panel>
        <div class="slider-card">
          <div class="resize-handle resize-handle-right"></div>

          <button class="shuffle-btn" type="button" aria-label="Shuffle slider values" data-shuffle-btn>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polyline points="16 3 21 3 21 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="4" y1="20" x2="21" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <polyline points="21 16 21 21 16 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="4" y1="4" x2="9" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>

          <h1 class="panel-title">Sliders</h1>

          <div class="slider-item" data-min="1700" data-max="8000" data-value="3300" data-swatch="temperature">
            <div class="row">
              <span class="label-group">
                <span class="label">Highlight Temperature</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><span class="color-swatch" aria-hidden="true"></span><input class="value-num" type="text" inputmode="decimal" value="3300" size="4" maxlength="4" /></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="gradient-seg before"></div>
              <div class="gradient-seg after"></div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="1700"
                max="8000"
                step="50"
                value="3300"
              />
            </div>
          </div>

          <div class="slider-item" data-min="0.5" data-max="8" data-value="2.2" data-decimals="1" data-swatch="mono">
            <div class="row">
              <span class="label-group">
                <span class="label">Gamma</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><span class="color-swatch" aria-hidden="true"></span><input class="value-num" type="text" inputmode="decimal" value="2.2" size="3" maxlength="3" /></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="gradient-seg before mono"></div>
              <div class="gradient-seg after mono"></div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="0.5"
                max="8"
                step="0.1"
                value="2.2"
              />
            </div>
          </div>

          <div class="slider-item" data-min="0" data-max="1" data-value="0.5" data-decimals="2" data-swatch="hue">
            <div class="row">
              <span class="label-group">
                <span class="label">Hue</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><span class="color-swatch" aria-hidden="true"></span><input class="value-num" type="text" inputmode="decimal" value="0.50" size="4" maxlength="4" /></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="gradient-seg before hue"></div>
              <div class="gradient-seg after hue"></div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
              />
            </div>
          </div>

          <div class="slider-item" data-min="100" data-max="20000" data-value="400" data-decimals="0" data-freq-wave>
            <div class="row">
              <span class="label-group">
                <span class="label">Frequency</span>
                <button class="icon-btn" type="button" aria-label="Add" tabindex="-1">
                  <svg class="icon-default" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="7.9502" y="-0.535569" width="12" height="12" rx="2.5" transform="rotate(45 7.9502 -0.535569)" stroke="currentColor"/>
                    <rect x="7.4502" y="4.44971" width="1" height="7" rx="0.5" fill="currentColor"/>
                    <rect x="11.4502" y="7.44971" width="1" height="7" rx="0.5" transform="rotate(90 11.4502 7.44971)" fill="currentColor"/>
                  </svg>
                  <svg class="icon-hover" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.8291 0.878906C7.00067 -0.292667 8.89972 -0.292667 10.0713 0.878906L15.0215 5.82812C16.1931 6.9997 16.1931 8.89972 15.0215 10.0713L10.0713 15.0205C8.89972 16.1921 7.00067 16.1921 5.8291 15.0205L0.878906 10.0713C-0.292667 8.89972 -0.292667 6.9997 0.878906 5.82812L5.8291 0.878906ZM7.9502 4.4502C7.67405 4.4502 7.4502 4.67405 7.4502 4.9502V7.4502H4.9502C4.67405 7.4502 4.4502 7.67405 4.4502 7.9502C4.45046 8.22611 4.67422 8.4502 4.9502 8.4502H7.4502V10.9502C7.45046 11.2261 7.67422 11.4502 7.9502 11.4502C8.22617 11.4502 8.44993 11.2261 8.4502 10.9502V8.4502H10.9502C11.2262 8.4502 11.4499 8.22611 11.4502 7.9502C11.4502 7.67405 11.2263 7.4502 10.9502 7.4502H8.4502V4.9502C8.4502 4.67405 8.22634 4.4502 7.9502 4.4502Z" fill="currentColor"/>
                  </svg>
                </button>
              </span>
              <span class="value"><svg class="freq-wave" height="14" viewBox="0 0 32 14" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0.0,8.0 L1.0,6.83 L2.0,5.7 L3.0,4.67 L4.0,3.76 L5.0,3.01 L6.0,2.46 L7.0,2.12 L8.0,2.0 L9.0,2.12 L10.0,2.46 L11.0,3.01 L12.0,3.76 L13.0,4.67 L14.0,5.7 L15.0,6.83 L16.0,8.0 L17.0,9.17 L18.0,10.3 L19.0,11.33 L20.0,12.24 L21.0,12.99 L22.0,13.54 L23.0,13.88 L24.0,14.0 L25.0,13.88 L26.0,13.54 L27.0,12.99 L28.0,12.24 L29.0,11.33 L30.0,10.3 L31.0,9.17 L32.0,8.0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg><input class="value-num" type="text" inputmode="numeric" value="400" size="5" maxlength="5" /></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="100"
                max="20000"
                step="100"
                value="400"
              />
            </div>
          </div>
        </div>

        <div class="settings-card">
          <h1 class="panel-title">Controls</h1>

          <div class="switch-row">
            <span class="label">Minimal Sliders</span>
            <button class="switch" type="button" role="switch" aria-checked="false" data-minimal-toggle>
              <span class="switch-knob"></span>
            </button>
          </div>

          <div class="switch-row">
            <span class="label">Sliders v2</span>
            <button class="switch" type="button" role="switch" aria-checked="false" data-v2-toggle>
              <span class="switch-knob"></span>
            </button>
          </div>

          <div class="switch-row" data-colored-handle-row hidden>
            <span class="label">Colored Handle</span>
            <button class="switch is-on" type="button" role="switch" aria-checked="true" data-colored-handle-toggle>
              <span class="switch-knob"></span>
            </button>
          </div>

          <div class="slider-item" data-min="25" data-max="300" data-value="50" data-decimals="0" data-css-var="--anim-ms">
            <div class="row">
              <span class="label-group">
                <span class="label">Hover Speed</span>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="numeric" value="50" size="3" maxlength="3" /><sup>ms</sup></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="25"
                max="300"
                step="5"
                value="50"
              />
            </div>
          </div>

          <div class="switch-row">
            <span class="label">Elasticity</span>
            <button class="switch is-on" type="button" role="switch" aria-checked="true" data-elasticity-toggle>
              <span class="switch-knob"></span>
            </button>
          </div>

          <div class="slider-item" data-min="2" data-max="10" data-value="5" data-decimals="0" data-elasticity-strength>
            <div class="row">
              <span class="label-group">
                <span class="label">Elasticity Strength</span>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="numeric" value="5" size="2" maxlength="2" /><sup>px</sup></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="2"
                max="10"
                step="1"
                value="5"
              />
            </div>
          </div>

          <div class="slider-item" data-min="50" data-max="500" data-value="150" data-decimals="0" data-shuffle-duration>
            <div class="row">
              <span class="label-group">
                <span class="label">Shuffle Duration</span>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="numeric" value="150" size="3" maxlength="3" /><sup>ms</sup></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="50"
                max="500"
                step="10"
                value="150"
              />
            </div>
          </div>

          <div class="slider-item" data-min="0" data-max="150" data-value="25" data-decimals="0" data-shuffle-delay>
            <div class="row">
              <span class="label-group">
                <span class="label">Shuffle Delay</span>
              </span>
              <span class="value"><input class="value-num" type="text" inputmode="numeric" value="25" size="3" maxlength="3" /><sup>ms</sup></span>
            </div>

            <div class="track-wrap">
              <div class="gray-bar">
                <div class="gray-fill before"></div>
                <div class="gray-fill after"></div>
              </div>
              <div class="thumb"></div>
              <input
                class="range-input"
                type="range"
                min="0"
                max="150"
                step="5"
                value="25"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="scripts/slider.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
